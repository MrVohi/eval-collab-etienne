version: '3'

services:
  app:
    image: myapp:latest
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_PASSWORD: supersecret123
      SECRET_KEY: my-very-secret-key-do-not-share
    depends_on:
      - db
    volumes:
      - ./app:/app

  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: supersecret123
      POSTGRES_USER: admin
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

volumes:
  db_data:
